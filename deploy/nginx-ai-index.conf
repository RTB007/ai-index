# /etc/nginx/sites-available/ai-index.lowlandcapital.com
# Symlink into sites-enabled and reload nginx. Get TLS via certbot.

server {
    listen 80;
    listen [::]:80;
    server_name ai-index.lowlandcapital.com;

    # certbot will inject the 443 block and a redirect here.
    root /home/CHANGE_ME/ai-index/web;
    index index.html;

    # Long-cache static assets, but never the data.json.
    location = /data.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/ai-index.access.log;
    error_log  /var/log/nginx/ai-index.error.log;
}
