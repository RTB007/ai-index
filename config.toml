# ai-index configuration

[db]
path = "data/ai_index.db"

[export]
json_path = "web/data.json"

[scoring]
# Path to the claude CLI. On Linux server typically just "claude".
# Override per environment if needed.
claude_bin = "claude"
prompt_version = 1
# Window size (days) of indicator history Claude sees when scoring today.
window_days = 30

[stocks]
# Benchmark used to compute basket-vs-market relative returns.
benchmark = "SPY"

# Main AI basket: chip + hyperscaler + AI-software plays.
tickers = [
    "NVDA",   # GPU king
    "MSFT",   # OpenAI exposure
    "GOOGL",  # Gemini
    "META",   # Llama, infra spend
    "AMD",    # MI300 / accelerators
    "PLTR",   # AI/enterprise hype proxy
    "AVGO",   # custom AI silicon
    "TSM",    # foundry
    "BOTZ",   # AI/robotics ETF
]

# Power basket: utilities/grid exposed to AI datacenter capex (PPAs, nuclear restarts).
# Indicator: power_vs_spy_30d (relative 30d return) → supply-side heat signal.
power_basket = [
    "VST",    # Vistra
    "CEG",    # Constellation Energy
    "TLN",    # Talen Energy
    "GEV",    # GE Vernova (history starts Apr 2024)
    "NRG",    # NRG Energy
]

# GPU-cloud basket: pure-play GPU rental businesses.
# Indicator: gpu_basket_vs_spy_30d → GPU supply-tightness proxy.
gpu_basket = [
    "CRWV",   # CoreWeave (IPO Mar 2025)
    "NBIS",   # Nebius
    "IREN",   # Iris Energy
    "APLD",   # Applied Digital
]

[indicators.trends]
enabled = true
# Google Trends keywords; one composite value per day (mean of normalized series).
keywords = ["AI", "ChatGPT", "AGI", "Claude AI", "Gemini AI"]
geo = ""  # worldwide

[indicators.hackernews]
enabled = true
# Algolia HN search; daily story count matching ANY of these keywords (OR-union via optionalWords).
keywords = ["AI", "LLM", "GPT", "ChatGPT", "Claude", "Gemini", "AGI"]

[indicators.arxiv]
enabled = true
# Daily submission count to these categories.
categories = ["cs.AI", "cs.LG", "cs.CL"]

[indicators.gdelt]
enabled = true
# GDELT DOC 2.0 query; daily article volume matching theme.
query = "(artificial intelligence) OR ChatGPT OR \"large language model\""

[indicators.github_stars]
enabled = false   # needs token, off by default
repos = [
    "langchain-ai/langchain",
    "ggerganov/llama.cpp",
    "huggingface/transformers",
    "openai/whisper",
]

[indicators.reddit]
enabled = false   # needs creds

[indicators.producthunt]
enabled = false   # needs token

[indicators.basket_signals]
# Reads stock_prices to compute basket-vs-SPY 30d relative returns. Cheap, always on.
enabled = true

[indicators.gpu_spot]
enabled = true
# Azure Retail Prices API; no key. Forward-only (no historical backfill).
skus = [
    "Standard_ND96amsr_A100_v4",   # 8x A100 80GB
    "Standard_ND96isr_H100_v5",    # 8x H100 80GB w/ InfiniBand (AI training canonical)
]
regions = ["eastus", "eastus2", "westus2", "westus3", "westeurope"]
