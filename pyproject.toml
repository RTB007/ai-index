[project]
name = "ai-index"
version = "0.1.0"
description = "AI hype/fantasy index dashboard with daily Claude scoring"
requires-python = ">=3.11"
dependencies = [
    "pytrends>=4.9",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_index"]
